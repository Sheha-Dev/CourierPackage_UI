<div class="map-wrapper">

  <div
    #mapContainer
    class="map"
    [style.height]="height">
  </div>


  @if (
    !locations ||
    locations.length === 0
  ) {

    <div class="map-empty">

      <div class="empty-icon">
        📍
      </div>

      <h3>
        Select Location
      </h3>

      <p>
        Click anywhere on the map to
        select the warehouse location.
      </p>

    </div>

  }

</div>
